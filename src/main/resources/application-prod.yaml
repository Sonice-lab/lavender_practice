server:
  port: 5000

logging:
  level:
    root: INFO
    com.tenco.spring_blog: INFO


spring:
  # 데이터 베이스 연결 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA 설정
  jpa:
    hibernate:
      # 운영에서는 create 를 쓰지 않습니다. 없는 테이블과 컬럼만 추가합니다
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 10
        format_sql: true     # 출력되는 SQL을 콘솔창에 줄바꿈해 보기 좋게 표시
    # 추후 data.sql 을 테이블 생성후에 실행합니다
    defer-datasource-initialization: true

  # 서버 시작시 이 파일 실행 -> 없으면 샘플 데이터가 들어가지 않는다.
  sql:
    init:
      mode: always
      data-locations: classpath:db/data.sql